<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#19171c" />
    <meta name="description" content="Luma — Ambient cho YouTube. Ánh sáng theo video, riêng tư và xử lý ngay trên thiết bị." />
    <title>Luma — Ambient cho YouTube</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.65 system-ui, sans-serif; background: #19171c; color: #f5f1f6; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: radial-gradient(ellipse at 15% 5%, #704956 0, transparent 42%), radial-gradient(ellipse at 85% 95%, #35445a 0, transparent 48%), #19171c; }
      main { width: min(680px, 100%); box-sizing: border-box; padding: clamp(28px, 7vw, 56px); border: 1px solid #ffffff35; border-radius: 28px; background: #ffffff12; box-shadow: 0 24px 80px #0005; backdrop-filter: blur(18px); }
      .eyebrow { color: #d7cbd9; letter-spacing: .18em; text-transform: uppercase; font-size: .72rem; }
      h1 { margin: .25rem 0; font: italic 3.2rem Georgia, serif; }
      p { color: #e6e1e8; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
      a { color: #fff; text-decoration: none; border: 1px solid #ffffff55; background: #ffffff12; border-radius: 999px; padding: 10px 16px; }
      a:hover, a:focus-visible { background: #ffffff25; outline: 2px solid #d9caff; outline-offset: 2px; }
      footer { margin-top: 30px; color: #c7becb; font-size: .85rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Ánh sáng theo cảm xúc</div>
      <h1>Luma</h1>
      <p>Luma tạo ánh sáng ambient đồng bộ với video YouTube, ngay trên thiết bị của bạn. Màu video được xử lý cục bộ; cài đặt được lưu trong Chrome.</p>
      <nav aria-label="Tài liệu Luma">
        <a href="privacy-policy.html">Chính sách quyền riêng tư / Privacy policy</a>
        <a href="https://github.com/dt418/luma-ambient-youtube">Mã nguồn trên GitHub</a>
      </nav>
      <footer>Luma — Ambient cho YouTube · Phiên bản 1.0.0</footer>
    </main>
  </body>
</html>
